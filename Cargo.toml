[package]
name = "shieldenv"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Encrypted environment vaults with runtime injection"
license = "MIT"
authors = ["Sebastian Cheikh"]
repository = "https://github.com/SrPlugin/ShieldEnv"
readme = "README.md"
keywords = ["secrets", "dotenv", "encryption", "vault", "cli"]
categories = ["command-line-utilities", "cryptography"]

[dependencies]
age = "0.12.1"
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "parallel", "zeroize"] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "zeroize"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
clap_complete = "4.6.11"
dirs = "7.0.0"
ed25519-dalek = { version = "3.0.0", features = ["digest"] }
getrandom = "0.4.3"
humantime = "2.4.0"
rpassword = "7.5.4"
secrecy = "0.10.3"
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
zeroize = { version = "1.9.1", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", default-features = false, features = ["std", "process", "fs"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
proptest = "1.12.0"
serde_json = "1.0.154"
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
